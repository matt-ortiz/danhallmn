---
layout: default
---
<section class="hero hero--compact">
  <div class="wrap">
    {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.lead %}<p class="hero__lead">{{ page.lead }}</p>{% endif %}
  </div>
</section>

<section class="section section--paper">
  <div class="wrap wrap--narrow prose">
    {{ content }}
  </div>
</section>
